<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #canvas {
      width: 512px;
      height: 512px;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="512" height="512"></canvas>
  <script>
    const img = new Image();
    img.src = '../logo azelib.jpg';
    img.onload = () => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      // Pure crisp white background (standard for Google Play store icons)
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, 512, 512);

      // Circle parameters in original 1024x1024 image:
      // The circle emblem is centered at (512, 492) with radius approx 345px
      const srcCX = 512;
      const srcCY = 492;
      const srcR = 346;

      // Target circle on 512x512 canvas:
      // Center at (256, 256) with radius 230 (leaving clean 26px margin for Play Store squircle mask)
      const dstCX = 256;
      const dstCY = 256;
      const dstR = 232;

      ctx.save();
      ctx.beginPath();
      ctx.arc(dstCX, dstCY, dstR, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();

      // Draw source circle into target circle
      ctx.drawImage(
        img,
        srcCX - srcR, srcCY - srcR, srcR * 2, srcR * 2,
        dstCX - dstR, dstCY - dstR, dstR * 2, dstR * 2
      );
      ctx.restore();

      // Soft subtle outline around the circle for clean contrast against pure white
      ctx.beginPath();
      ctx.arc(dstCX, dstCY, dstR, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(30, 27, 75, 0.08)';
      ctx.lineWidth = 2;
      ctx.stroke();
    };
  </script>
</body>
</html>
