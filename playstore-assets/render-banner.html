<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background: linear-gradient(135deg, #090D16 0%, #151638 40%, #312E81 75%, #4F46E5 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 75px;
      color: #FFFFFF;
      position: relative;
    }
    .bg-circle {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.22) 0%, rgba(99, 102, 241, 0.06) 60%, transparent 100%);
      right: 10px;
      top: -30px;
      pointer-events: none;
    }
    .left {
      max-width: 550px;
      z-index: 2;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 18px;
      color: #C7D2FE;
    }
    .badge svg {
      color: #818CF8;
    }
    h1 {
      font-size: 40px;
      font-weight: 900;
      line-height: 1.16;
      margin-bottom: 12px;
      letter-spacing: -0.8px;
    }
    h1 .highlight {
      color: #A5B4FC;
      display: block;
      font-size: 32px;
      font-weight: 750;
      margin-top: 4px;
    }
    p {
      font-size: 15.5px;
      line-height: 1.55;
      color: #E0E7FF;
      font-weight: 400;
    }
    .features-pill {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 600;
      color: #F1F5F9;
      letter-spacing: 0.2px;
    }
    .pill svg {
      color: #A5B4FC;
    }
    .right {
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circle-logo {
      width: 290px;
      height: 290px;
      border-radius: 50%;
      background: #FFFFFF;
      padding: 6px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 0 0 8px rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circle-logo img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="bg-circle"></div>
  <div class="left">
    <div class="badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>
      Aplikasi Manajemen Perpustakaan
    </div>
    <h1>Azelib <span class="highlight">Kelola Perpustakaan</span></h1>
    <p>Kelola koleksi buku, sirkulasi peminjaman, data anggota, dan laporan perpustakaan secara rapi, cepat, dan terorganisir.</p>
    <div class="features-pill">
      <span class="pill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        Katalog &amp; Rak
      </span>
      <span class="pill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        Sirkulasi Real-time
      </span>
      <span class="pill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Multi-tenant
      </span>
      <span class="pill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
        Ekspor PDF
      </span>
    </div>
  </div>
  <div class="right">
    <div class="circle-logo">
      <img src="icon-512.png">
    </div>
  </div>
</body>
</html>
