<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-container {
      width: 512px;
      height: 512px;
      position: relative;
      overflow: hidden;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    img {
      width: 580px;
      height: 580px;
      object-fit: cover;
      transform: scale(1.08);
    }
  </style>
</head>
<body>
  <div class="icon-container">
    <img src="../logo azelib.jpg">
  </div>
</body>
</html>
